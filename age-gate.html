<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Verification — The Inconvenience Store</title>
  <link rel="icon" href="img/cs.ico" type="image/x-icon">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="wrap">
    <div class="age-warn">
      <h2>&#9888; AGE VERIFICATION REQUIRED &#9888;</h2>
      <p class="impact">THIS PRODUCT IS AGE RESTRICTED</p>
      <p style="font-family:'Courier New',monospace;font-size:13px">Two checks. Both mandatory.</p>
      <button class="btn" id="siren" style="margin-top:10px">&#128266; ENABLE SIREN</button>
    </div>

    <!-- Step 1 -->
    <div class="age-step" id="step1">
      <p class="step-count impact">Check 1 of 2</p>
      <h2>Select Tinky-Winky</h2>
      <div class="tinky-grid" id="tinkyGrid"></div>
      <p id="tinkyFeedback" class="impact" style="color:#C0122B"></p>
    </div>

    <!-- Step 2 -->
    <div class="age-step" id="step2" style="display:none">
      <p class="step-count impact">Check 2 of 2</p>
      <h2>What is this?</h2>
      <img class="quiz-image" src="img/save-icon.svg" alt="An object">
      <form id="euroForm"></form>
      <p><button class="btn" id="euroSubmit">SUBMIT</button></p>
      <p id="euroFeedback" class="impact" style="color:#C0122B"></p>
    </div>
  </div>

  <audio id="sirenAudio" src="music/benny.mp3" loop></audio>
  <script src="log.js"></script>
  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="age-gate.js"></script>
  <script src="nav.js"></script>
</body>
</html>
