<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Verification — The Inconvenience Store</title>
  <link rel="icon" href="img/cs.ico" type="image/x-icon">
  <link rel="stylesheet" href="shop.css?v=1789431607">
  <link rel="stylesheet" href="nav.css?v=1789431607">
</head>
<body>
  <div class="wrap">
    <div class="age-warn">
      <h2>&#9888; AGE VERIFICATION REQUIRED &#9888;</h2>
      <p class="impact">THIS PRODUCT IS AGE RESTRICTED</p>
    </div>

    <!-- Step 1 -->
    <div class="age-step" id="step1">
      <h2>Which one is Tinky-Winky?</h2>
      <div class="tinky-grid" id="tinkyGrid"></div>
      <p id="tinkyFeedback" class="impact" style="color:#C0122B"></p>
    </div>

    <!-- Step 2 -->
    <div class="age-step" id="step2" style="display:none">
      <p class="step-count impact">Check 2 of 2</p>
      <h2>What is this?</h2>
      <img class="quiz-image" src="img/save-icon.png" alt="An object">
      <form id="euroForm"></form>
      <p><button class="btn" id="euroSubmit">SUBMIT</button></p>
      <p id="euroFeedback" class="impact" style="color:#C0122B"></p>
    </div>
  </div>

  <audio id="alarm" src="music/alarm.mp3" loop></audio>
  <script src="log.js?v=1789431607"></script>
  <script src="products.js?v=1789431607"></script>
  <script src="cart.js?v=1789431607"></script>
  <script src="age-gate.js?v=1789431607"></script>
  <script src="nav.js?v=1789431607"></script>
  <script src="splats.js?v=1789431607"></script>
</body>
</html>
